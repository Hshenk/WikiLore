<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyndryss WikiLore</title>

  <!-- Tab icon: sibling of the map's compass (same ring, W instead of needle). -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/wikilore.svg">

  <!-- Amarante: the display font shared with the campaign map, so the two
       sites feel like one product. Single 400 weight. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amarante&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== Glitch filters (Guide 12) =====================
       The warp layer. feTurbulence makes noise; feDisplacementMap shoves the
       rendered pixels around according to it. A very low X frequency with a
       higher Y frequency gives horizontal tearing rather than a uniform blur.
       The <animate> tags drive themselves, so this layer needs no JavaScript.
       Levels are tuned: 1 faint, 2 unstable, 3 collapsing.
       The oversized filter region stops displaced pixels being clipped. -->
  <svg class="glitch-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="glitch-warp-1" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.00001 0.05" numOctaves="1" seed="3" result="n">
        <animate attributeName="baseFrequency" dur="7s" repeatCount="indefinite"
                 values="0.00001 0.03;0.00001 0.07;0.00001 0.04;0.00001 0.03"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="glitch-warp-2" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.00001 0.12" numOctaves="1" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="3.2s" repeatCount="indefinite"
                 values="0.00001 0.08;0.00001 0.16;0.00001 0.10;0.00001 0.08"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="glitch-warp-3" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.00001 0.28" numOctaves="2" seed="11" result="n">
        <animate attributeName="baseFrequency" dur="2s" repeatCount="indefinite"
                 values="0.00001 0.18;0.00001 0.40;0.00001 0.22;0.00001 0.18"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="20"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="app">

    <header class="app-header">
      <!-- Two separate links: "Lyndryss" goes up to the hub, "WikiLore"
           returns to this site's index. (Links can't nest, so the wrapper
           is a plain div.) -->
      <div class="site-title">
        <a class="site-title__home" href="https://lyndryss.com/">Lyndryss</a>
        <a class="site-title__accent" href="#/">WikiLore</a>
      </div>
      <div class="header-actions">
        <div class="search-wrap">
          <input id="search-box" type="search" placeholder="Search the lore…" autocomplete="off">
          <div id="search-results" class="search-results is-hidden"></div>
        </div>

        <!-- GM only: temporarily switch the glitch effect off so you can
             actually read your own lore while prepping. JS unhides it. -->
        <button id="stabilize-toggle" class="header-btn is-hidden" type="button">Stabilize</button>

        <button id="gm-login-toggle" class="header-btn" type="button">Sign in</button>

        <!-- Dropdown panel: shows the sign-in form when signed out, the
             signed-in block when the GM session is active. JS toggles
             .is-hidden on the panel and swaps which child is visible. -->
        <div id="gm-login-panel" class="gm-panel is-hidden">
          <form id="gm-login-form">
            <label class="gm-panel__field">
              <span>Email</span>
              <input id="gm-email" type="email" autocomplete="username" required>
            </label>
            <label class="gm-panel__field">
              <span>Password</span>
              <input id="gm-password" type="password" autocomplete="current-password"
                     required minlength="6">
            </label>
            <div class="gm-panel__actions">
              <button class="header-btn header-btn--primary" type="submit">Sign in</button>
              <button id="gm-signup" class="header-btn" type="button">Create account</button>
            </div>
            <!-- JS sets the text and toggles .is-hidden / .is-ok — errors read red,
                 the "check your email" confirmation reads muted. -->
            <p id="gm-login-error" class="gm-panel__error is-hidden"></p>
          </form>
          <!-- First-time players pick a public display name (Guide 07). -->
          <form id="name-form" class="is-hidden">
            <p class="gm-panel__status">Welcome! Pick a display name — other
              players will see it on your articles.</p>
            <label class="gm-panel__field">
              <span>Display name</span>
              <input id="name-input" maxlength="40" autocomplete="nickname" required>
            </label>
            <button class="header-btn header-btn--primary" type="submit">Save name</button>
            <p id="name-error" class="gm-panel__error is-hidden"></p>
          </form>
          <div id="gm-signed-in" class="is-hidden">
            <p id="session-status" class="gm-panel__status"></p>
            <button id="gm-signout" class="header-btn" type="button">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- All articles render into #content. JS owns everything inside it. -->
    <main id="content" class="content">
      <noscript>
        <p class="notice">WikiLore needs JavaScript to load its articles.</p>
      </noscript>
    </main>

    <footer class="app-footer">
      A living chronicle of Lyndryss — companion to the
      <a href="https://map.lyndryss.com">campaign map</a>.
    </footer>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
